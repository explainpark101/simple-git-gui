name: Release

# On every push to main: read workspace.package.version from Cargo.toml.
# If tag vX.Y.Z does not exist yet, build installers and create a GitHub Release.
# Re-pushes with the same version are no-ops (no duplicate tags/releases).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from Cargo.toml
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true
          VERSION="$(
            awk '
              /^\[workspace\.package\]/ { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [[ -z "${VERSION}" ]]; then
            echo "error: workspace.package.version not found in Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid version '${VERSION}'" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No existing tag/release for ${TAG} — will release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            script: ./build-exe.sh
            artifact: windows
            glob: |
              dist/*-setup.exe
              dist/sgg.exe
          - os: macos-latest
            target: macos
            script: ./build-dmg.sh
            artifact: macos
            glob: |
              dist/*.dmg
          - os: ubuntu-latest
            target: linux
            script: ./build-appimage.sh
            artifact: linux
            glob: |
              dist/*.AppImage
              dist/sgg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-${{ matrix.target }}

      - name: Linux packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf fuse libfuse2 \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build package
        run: |
          chmod +x build.sh run.sh build-exe.sh build-dmg.sh build-appimage.sh packaging/common.sh || true
          ${{ matrix.script }}

      - name: Also keep release binary in dist
        run: |
          mkdir -p dist
          if [[ -f target/release/sgg.exe ]]; then
            cp -f target/release/sgg.exe dist/sgg.exe
          elif [[ -f target/release/sgg ]]; then
            cp -f target/release/sgg dist/sgg
            chmod +x dist/sgg
          fi
          ls -lah dist || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sgg-${{ needs.prepare.outputs.tag }}-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sgg-${{ needs.prepare.outputs.tag }}-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
