name: Release

# On every push to main: read workspace.package.version from Cargo.toml.
# If tag vX.Y.Z does not exist yet, build installers and create a GitHub Release.
# Re-pushes with the same version are no-ops (no duplicate tags/releases).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from Cargo.toml
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true
          VERSION="$(
            awk '
              /^\[workspace\.package\]/ { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && /^version[[:space:]]*=/ {
                gsub(/["\r]/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          # Cargo.toml may be checked out with CRLF; strip leftover CR/whitespace.
          VERSION="${VERSION//$'\r'/}"
          VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
          VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"
          if [[ -z "${VERSION}" ]]; then
            echo "error: workspace.package.version not found in Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid version '${VERSION}'" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skip release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No existing tag/release for ${TAG} — will release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # Artifacts:
  # - Windows: *-setup.exe (NSIS installer) + sgg_portable*.exe (no-install binary)
  # - macOS: *.dmg
  # - Linux: *.AppImage + linux_sgg_portable (raw ELF, same role as portable .exe)
  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            script: ./build-exe.sh
            artifact: windows-x64
            # Zip-friendly standalone binary (x86_64). Installer is separate.
            portable_name: sgg_portable.exe
            glob: |
              dist/*-setup.exe
              dist/sgg_portable.exe
          - os: windows-11-arm
            target: windows-arm64
            script: ./build-exe.sh
            artifact: windows-arm64
            # Snapdragon / Windows on ARM portable binary.
            portable_name: sgg_portable_arm64.exe
            glob: |
              dist/*-setup.exe
              dist/sgg_portable_arm64.exe
          - os: macos-latest
            target: macos
            script: ./build-dmg.sh
            artifact: macos
            portable_name: ""
            glob: |
              dist/*.dmg
          - os: ubuntu-latest
            target: linux
            script: ./build-appimage.sh
            artifact: linux
            portable_name: linux_sgg_portable
            glob: |
              dist/*.AppImage
              dist/linux_sgg_portable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-${{ matrix.target }}

      - name: Linux packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf fuse libfuse2 \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Optional macOS Developer ID + notarization (Gatekeeper-clean DMG).
      # Secrets are optional: without them the job still produces an ad-hoc DMG.
      - name: Import Apple Developer ID certificate
        if: matrix.target == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: sgg-ci-keychain
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE}" ]]; then
            echo "No MACOS_CERTIFICATE secret — ad-hoc sign only."
            exit 0
          fi
          CERTIFICATE_PATH="${RUNNER_TEMP}/build_certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          echo -n "${MACOS_CERTIFICATE}" | base64 --decode -o "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Prepare Apple notary API key
        if: matrix.target == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY}" ]]; then
            echo "No APPLE_API_KEY secret — skip notary API key file."
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo -n "${APPLE_API_KEY}" | base64 --decode -o "${KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"
          chmod 600 "${KEY_PATH}"

      - name: Build package
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Scripts may be 100644 on some checkouts; always invoke via bash.
          chmod +x \
            build.sh run.sh build-exe.sh build-dmg.sh build-appimage.sh \
            packaging/common.sh packaging/macos-adhoc-sign.sh \
            packaging/macos-sign.sh packaging/macos-notarize.sh \
            packaging/macos/install-from-github.sh || true
          bash "${{ matrix.script }}"

      - name: Also keep portable release binary in dist
        run: |
          set -euo pipefail
          mkdir -p dist
          PORTABLE_NAME="${{ matrix.portable_name }}"
          if [[ -z "${PORTABLE_NAME}" ]]; then
            ls -lah dist || true
            exit 0
          fi
          if [[ -f target/release/sgg.exe ]]; then
            cp -f target/release/sgg.exe "dist/${PORTABLE_NAME}"
          elif [[ -f target/release/sgg ]]; then
            cp -f target/release/sgg "dist/${PORTABLE_NAME}"
            chmod +x "dist/${PORTABLE_NAME}"
          else
            echo "error: release binary not found under target/release/" >&2
            ls -lah target/release || true
            exit 1
          fi
          ls -lah dist || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sgg-${{ needs.prepare.outputs.tag }}-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sgg-${{ needs.prepare.outputs.tag }}-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Generate latest.json (auto-update manifest)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x packaging/generate-latest-json.sh || true
          bash packaging/generate-latest-json.sh release-assets

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Auto-update
            Manifest: [`latest.json`](https://github.com/${{ github.repository }}/releases/latest/download/latest.json)

            ```bash
            sgg check-update
            sgg update
            ```

            ## macOS / Gatekeeper
            브라우저로 DMG를 받아 “확인할 수 없습니다”가 뜨면:

            ```bash
            xattr -cr ~/Downloads/simple-git-gui_*.dmg
            open ~/Downloads/simple-git-gui_*.dmg
            ```

            또는 quarantine 없이 설치:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/explainpark101/simple-git-gui/main/packaging/macos/install-from-github.sh | bash
            ```

            DMG를 연 뒤 **Install sgg.command**를 실행하거나 `.app`을 Applications로 드래그하세요.
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
