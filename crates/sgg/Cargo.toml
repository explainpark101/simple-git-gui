[package]
name = "sgg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "simple-git-gui — lightweight Git GUI"
default-run = "sgg"
build = "build.rs"

[[bin]]
name = "sgg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sgg-core.workspace = true
gpui-kit = { version = "0.9", features = ["gpui-fast"] }
clap = { version = "4", features = ["derive"] }
# In-app terminal: PTY + VTE parser (ROADMAP). libghostty-vt needs Zig at
# build time; alacritty_terminal is the portable VTE engine we ship today.
portable-pty = "0.9"
alacritty_terminal = "0.26"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
image = "0.25"
ico = "0.4"
winresource = "0.1"

# cargo-packager (NSIS / DMG / AppImage). Prefer over Inno Setup.
# See build-exe.sh, build-dmg.sh, build-appimage.sh
[package.metadata.packager]
product-name = "simple-git-gui"
identifier = "com.simple-git-gui.sgg"
publisher = "simple-git-gui"
before-packaging-command = "cargo build --release -p sgg"
# Sign the .app with ad-hoc identity before the DMG step (see script header).
# Do NOT set macos.signing-identity = "-" — packager adds --options runtime.
before-each-package-command = "bash ../../packaging/macos-adhoc-sign.sh"
binaries-dir = "../../target/release"
out-dir = "../../dist"
# macOS ICNS packing rejects a bare 1024×1024 PNG (density 1 → no IconType).
# Name the same bitmap as 512@2x so cargo-packager maps it to a valid ICNS type.
# Keep app-icon-1024.png for Windows build.rs embedding / source art.
icons = ["assets/icon/app-icon-512x512@2x.png"]
category = "DeveloperTool"

[[package.metadata.packager.binaries]]
path = "sgg"
main = true

[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "../../packaging/windows/installer.nsi"
languages = ["English"]

[package.metadata.packager.dmg]
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }

[package.metadata.packager.deb]
desktop-template = "../../packaging/linux/sgg.desktop"

[package.metadata.packager.appimage.files]
"../../packaging/linux/sgg.desktop" = "usr/share/applications/sgg.desktop"
