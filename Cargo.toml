[workspace]
resolver = "2"
members = ["crates/sgg-core", "crates/sgg"]
default-members = ["crates/sgg"]

[workspace.package]
version = "1.5.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/explainpark101/simple-git-gui"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sgg-core = { path = "crates/sgg-core" }

# Keep UI deps fast during `cargo run` (debug). Matches report: debug mouse
# dispatch was ~2× slower than release without this.
[profile.dev.package."*"]
opt-level = 3
