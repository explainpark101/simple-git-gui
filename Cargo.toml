[workspace]
resolver = "2"
members = ["crates/sgg-core", "crates/sgg"]
default-members = ["crates/sgg"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/simple-git-gui"

[workspace.dependencies]
anyhow = "1"
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sgg-core = { path = "crates/sgg-core" }
